workflows:
  android-workflow:
    name: tabebik_user Android
    instance_type: mac_mini_m1
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare existing Android project and Gradle Wrapper
        script: |
          set -e

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: Firebase google-services.json is missing."
            exit 1
          fi

          if [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Existing Android Gradle file is missing."
            exit 1
          fi

          flutter clean
          flutter pub get

          # Generate only the missing Gradle Wrapper files.
          # This does NOT recreate or replace the Android project.
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper is incomplete. Generating wrapper files..."

            WRAPPER_VERSION="9.5.0"
            TEMP_DIR="$(mktemp -d)"
            mkdir -p "$TEMP_DIR/wrapper-project"

            printf "rootProject.name = 'wrapper-bootstrap'\n" > "$TEMP_DIR/wrapper-project/settings.gradle"
            touch "$TEMP_DIR/wrapper-project/build.gradle"

            curl -fL "https://services.gradle.org/distributions/gradle-${WRAPPER_VERSION}-bin.zip" -o "$TEMP_DIR/gradle.zip"
            unzip -q "$TEMP_DIR/gradle.zip" -d "$TEMP_DIR"

            "$TEMP_DIR/gradle-${WRAPPER_VERSION}/bin/gradle" \
              -p "$TEMP_DIR/wrapper-project" \
              wrapper --gradle-version "$WRAPPER_VERSION" --distribution-type all

            mkdir -p android/gradle/wrapper
            cp "$TEMP_DIR/wrapper-project/gradlew" android/gradlew
            cp "$TEMP_DIR/wrapper-project/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
            cp "$TEMP_DIR/wrapper-project/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/
            chmod +x android/gradlew

            rm -rf "$TEMP_DIR"
          fi

          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Could not generate Gradle Wrapper."
            exit 1
          fi

      - name: Build release APK with detailed diagnostics
        script: |
          set -e

          if flutter build apk --release --verbose; then
            echo "Release APK built successfully."
          else
            BUILD_EXIT_CODE=$?
            echo "Flutter build failed. Running Gradle directly to expose the full Java/Gradle stacktrace..."
            cd android
            ./gradlew --no-daemon :app:assembleRelease --stacktrace --info
            exit "$BUILD_EXIT_CODE"
          fi

      - name: Print Android SHA-1 and SHA-256 fingerprints
        script: |
          set -e
          echo "========== TABEBIK ANDROID SIGNING FINGERPRINTS =========="
          cd android
          ./gradlew --no-daemon :app:signingReport
          echo "========== END SIGNING FINGERPRINTS =========="

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/output-metadata.json
