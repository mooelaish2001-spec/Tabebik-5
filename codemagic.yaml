workflows:
  android-workflow:
    name: tabebik_user Android
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Regenerate complete Android project
        script: |
          set -e
          mkdir -p /tmp/tabebik_firebase
          cp android/app/google-services.json /tmp/tabebik_firebase/google-services.json
          rm -rf android
          flutter create . --platforms=android --org com.tabebik --project-name tabebik_user
          mkdir -p android/app
          cp /tmp/tabebik_firebase/google-services.json android/app/google-services.json
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          set -e
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
