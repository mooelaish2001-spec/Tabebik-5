name: tabibak

description: "طبيبك — Arabic RTL medical booking app."

publish_to: 'none'

version: 1.0.0+1

environment:

  sdk: '>=3.4.0 <4.0.0'

  flutter: '>=3.22.0'

dependencies:

  flutter:

    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1

dev_dependencies:

  flutter_test:

    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:

    - assets/images/

  # Uncomment if you want to bundle Cairo locally (offline support)

