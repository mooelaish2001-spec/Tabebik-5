workflows:
  android-workflow:
    name: Tabebik-5 Android
    instance_type: mac_mini_m1
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Fix Android folder
        script: |
          flutter clean
          flutter create . --platforms=android
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
