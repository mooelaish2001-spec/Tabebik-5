workflows:
  android-workflow:
    name: tabebik_user Android
    instance_type: mac_mini_m1
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare existing Android project
        script: |
          set -e

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: Firebase google-services.json is missing."
            exit 1
          fi

          if [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Existing Android Gradle file is missing."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper is missing."
            exit 1
          fi

          chmod +x android/gradlew
          flutter clean
          flutter pub get

      - name: Build release APK
        script: |
          set -e
          flutter build apk --release

      - name: Print Android SHA-1 and SHA-256 fingerprints
        script: |
          set -e
          echo "========== TABEBIK ANDROID SIGNING FINGERPRINTS =========="
          cd android
          ./gradlew --no-daemon :app:signingReport
          echo "========== END SIGNING FINGERPRINTS =========="

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/output-metadata.json
